name: '🍿️ DualSubs: 🇳 Netflix'
description: Netflix 增强及双语字幕
compat_arguments:
  Type: Translate
  Languages[0]: AUTO
  Languages[1]: ZH
  Position: Forward
  Vendor: Google
  ShowOnly: 'false'
  Storage: PersistentStore
  LogLevel: WARN
compat_arguments_desc: |
  Type: [字幕] 启用类型
      └ Translate: 翻译字幕（翻译器）
  请选择要使用的字幕，双语字幕将使用您选择类型呈现。

  Languages[0]: [字幕] 主语言（源语言）
      ├ AUTO: 自动 - Automatic
      ├ ZH: 中文（自动）
      ├ ZH-HANS: 中文（简体）
      ├ ZH-HK: 中文（香港）
      ├ ZH-HANT: 中文（繁体）
      ├ EN: English - 英语（自动）
      ├ ES: Español - 西班牙语（自动）
      ├ JA: 日本語 - 日语
      ├ KO: 한국어 - 韩语
      ├ DE: Deutsch - 德语
      ├ FR: Français - 法语
      ├ TR: Türkçe - 土耳其语
      └ KM: ភាសាខ្មែរ - 高棉语
  当“主语言”字幕存在时，将生成“主语言/副语言（翻译）”与“主语言（外挂）”的字幕或字幕选项。仅当源语言识别不准确时更改此选项。

  Languages[1]: [字幕] 副语言（目标语言）
      ├ ZH: 中文（自动）
      ├ ZH-HANS: 中文（简体）
      ├ ZH-HK: 中文（香港）
      ├ ZH-HANT: 中文（繁体）
      ├ EN: English - 英语（自动）
      ├ ES: Español - 西班牙语（自动）
      ├ JA: 日本語 - 日语
      ├ KO: 한국어 - 韩语
      ├ DE: Deutsch - 德语
      ├ FR: Français - 法语
      ├ TR: Türkçe - 土耳其语
      └ KM: ភាសាខ្មែរ - 高棉语
  当“副语言”字幕存在时，将生成“副语言/主语言（官方）”的字幕或字幕选项。

  Position: [字幕] 主语言（源语言）字幕位置
      ├ Forward: 上面（第一行）
      └ Reverse: 下面（第二行）
  主语言（源语言）字幕的显示位置。

  Vendor: [翻译器] 服务商API
      ├ Google: Google Translate
      └ Microsoft: Microsoft Translator（需填写API）
  请选择翻译器所使用的服务商API，更多翻译选项请使用BoxJs。

  ShowOnly: [翻译器] 只显示翻译字幕
  是否仅显示翻译后字幕，不显示源语言字幕。

  Storage: [储存] 配置类型
      ├ Argument: 插件配置优先
      ├ PersistentStore: 持久化存储优先
      └ database: 仅使用默认配置
  默认优先使用设置面板或 BoxJS 保存的配置，其次使用插件配置，最后使用脚本默认配置。

  LogLevel: [调试] 日志等级
      ├ OFF: 关闭
      ├ ERROR: ❌ 错误
      ├ WARN: ⚠️ 警告
      ├ INFO: ℹ️ 信息
      ├ DEBUG: 🅱️ 调试
      └ ALL: 全部
  选择脚本日志的输出等级，低于所选等级的日志将全部输出。
open_url: https://dualsubs.github.io/preferences/
author: VirgilClyne[https://github.com/VirgilClyne]
homepage: https://DualSubs.github.io/guide/netflix
icon: https://github.com/DualSubs/Netflix/raw/main/src/assets/icon_rounded.png
dns: {}
map_locals:
- match: ^https:\/\/dualsubs\.github\.io\/api\/Netflix(?:\?.*)?$
  to: https://github.com/DualSubs/Netflix/releases/download/v0.6.0/DualSubs.Netflix.PreferencePanes.json
  status_code: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Cache-Control: no-store
    X-PreferencePanes-Version: 0.6.0
scriptings:
- http_response:
    name: 🍿️ DualSubs.Netflix.Translate.Subtitles.response
    match: ^https?:\/\/(.+)\.oca\.nflxvideo\.net\/\?o=\d+&v=\d+&e=\d+&t=.+
    script_url: https://github.com/DualSubs/Universal/releases/latest/download/Translate.response.bundle.js
    env:
      _compat.$argument: Type="{{{Type}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Position="{{{Position}}}"&Vendor="{{{Vendor}}}"&ShowOnly="{{{ShowOnly}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
mitm:
  hostnames:
    includes:
    - dualsubs.github.io
    - '*.oca.nflxvideo.net'
