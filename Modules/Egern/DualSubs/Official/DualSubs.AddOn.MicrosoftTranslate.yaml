name: '🍿️ DualSubs: ➕ AddOn (Microsoft Translate)'
description: DualSubs 额外插件\n切换为微软翻译并自动刷新Token
compat_arguments:
  cronexp: '"*/10 * * * *"'
compat_arguments_desc: 'cronexp: * * * * * *\n                │  │  │  │  │ └── 星期几 (0 - 6, 星期天 = 0)\n                │  │  │  │ └──── 月份 (1 - 12)\n                │  │  │ └────── 天数 (1 - 31)\n                │  │ └──────── 小时 (0 - 23)\n                │ └────────── 分钟 (0 - 59)\n               └──────────── [可选] 秒 (0 - 59)'
open_url: http://boxjs.com/#/app/DualSubs.AddOn
author: VirgilClyne[https://github.com/VirgilClyne]
homepage: https://DualSubs.github.io/guide/addon
icon: https://github.com/DualSubs/AddOn/raw/main/src/assets/icon_rounded.png
scriptings:
- schedule:
    name: 🍿️ DualSubs.AddOn.Microsoft.Translate
    cron: '{{{cronexp}}}'
    script_url: https://github.com/DualSubs/AddOn/releases/download/v1.0.8/Microsoft.Translate.bundle.js
    timeout: 60
