name: '🍿️ DualSubs: 🎵 Spotify'
description: Spotify 增强及双语歌词
compat_arguments:
  Types: Translate,External
  Languages[0]: AUTO
  Languages[1]: ZH
  Vendor: Google
  LrcVendor: NeteaseMusic
  Storage: PersistentStore
  LogLevel: WARN
compat_arguments_desc: |
  Types: [歌词] 启用类型（多选）
      ├ Translate: 翻译歌词（翻译器）
      └ External: 外部歌词（外部源）
  请选择要添加的歌词选项，如果为多选，则会自动决定提供的歌词类型。

  Languages[0]: [翻译器] 主语言（源语言）
      ├ AUTO: 自动 - Automatic
      ├ ZH: 中文（自动）
      ├ ZH-HANS: 中文（简体）
      ├ ZH-HK: 中文（香港）
      ├ ZH-HANT: 中文（繁体）
      ├ EN: English - 英语（自动）
      ├ ES: Español - 西班牙语（自动）
      ├ JA: 日本語 - 日语
      ├ KO: 한국어 - 韩语
      ├ DE: Deutsch - 德语
      ├ FR: Français - 法语
      ├ TR: Türkçe - 土耳其语
      └ KM: ភាសាខ្មែរ - 高棉语
  仅当源语言识别不准确时更改此选项。

  Languages[1]: [翻译器] 副语言（目标语言）
      ├ ZH: 中文（自动）
      ├ ZH-HANS: 中文（简体）
      ├ ZH-HK: 中文（香港）
      ├ ZH-HANT: 中文（繁体）
      ├ EN: English - 英语（自动）
      ├ ES: Español - 西班牙语（自动）
      ├ JA: 日本語 - 日语
      ├ KO: 한국어 - 韩语
      ├ DE: Deutsch - 德语
      ├ FR: Français - 法语
      ├ TR: Türkçe - 土耳其语
      └ KM: ភាសាខ្មែរ - 高棉语
  请指定翻译歌词的目标语言。

  Vendor: [翻译器] 服务商API
      ├ Google: Google Translate
      └ Microsoft: Microsoft Translator（需填写API）
  请选择翻译器所使用的服务商API，更多翻译选项请使用BoxJs。

  LrcVendor: [歌词] 服务商API
      ├ NeteaseMusic: 网易云音乐（官方）
      ├ QQMusic: QQ音乐（官方）
      └ NeteaseMusicNodeJS: 网易云音乐 NodeJS API
  请选择外部源所使用的服务商API。

  Storage: [储存] 配置类型
      ├ Argument: 插件配置优先
      ├ PersistentStore: 持久化存储优先
      └ database: 仅使用默认配置
  默认优先使用设置面板或 BoxJS 保存的配置，其次使用插件配置，最后使用脚本默认配置。

  LogLevel: [调试] 日志等级
      ├ OFF: 🔴 关闭
      ├ ERROR: ❌ 错误
      ├ WARN: ⚠️ 警告
      ├ INFO: ℹ️ 信息
      ├ DEBUG: 🅱️ 调试
      └ ALL: 全部
  选择脚本日志的输出等级，低于所选等级的日志将全部输出。
open_url: https://dualsubs.github.io/preferences/
author: VirgilClyne[https://github.com/VirgilClyne]
homepage: https://DualSubs.github.io/guide/spotify
icon: https://github.com/DualSubs/Spotify/raw/main/src/assets/icon_rounded.png
dns: {}
map_locals:
- match: ^https:\/\/dualsubs\.github\.io\/api\/Spotify(?:\?.*)?$
  to: https://github.com/DualSubs/Spotify/releases/download/v1.10.0/DualSubs.Spotify.PreferencePanes.json
  status_code: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Cache-Control: no-store
    X-PreferencePanes-Version: 1.10.0
scriptings:
- http_request:
    name: PreferencePanes.API
    match: ^https:\/\/dualsubs\.github\.io\/api\/(?:get|set|delete)(?:\?.*)?$
    script_url: https://github.com/NSNanoCat/PreferencePanes/releases/download/v1.3.1/api.js
    max_size: 65536
    body_required: true
- http_response:
    name: 🍿️ DualSubs.Spotify.Tracks.response.json
    match: ^https?:\/\/api\.spotify\.com\/v1\/tracks\?
    script_url: https://github.com/DualSubs/Spotify/releases/download/v1.10.0/response.bundle.js
    env:
      _compat.$argument: Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_request:
    name: 🍿️ DualSubs.Spotify.Lyrics.request.json
    match: ^https?:\/\/(.+-spclient|spclient\.wg).spotify\.com(:443)?\/color-lyrics\/v2\/track\/(.+)\?(.*)format=json
    script_url: https://github.com/DualSubs/Spotify/releases/download/v1.10.0/request.bundle.js
    env:
      _compat.$argument: Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_request:
    name: 🍿️ DualSubs.Spotify.Lyrics.request.proto
    match: ^https?:\/\/(.+-spclient|spclient\.wg).spotify\.com(:443)?\/color-lyrics\/v2\/track\/\w+\?(.*)
    script_url: https://github.com/DualSubs/Spotify/releases/download/v1.10.0/request.bundle.js
    env:
      _compat.$argument: Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
    binary_body: true
- http_response:
    name: 🍿️ DualSubs.Spotify.Translate.Lyrics.response.json
    match: ^https?:\/\/(.+-spclient|spclient\.wg).spotify\.com(:443)?\/color-lyrics\/v2\/track\/(.+)\?(.*)format=json(.*)subtype=Translate
    script_url: https://github.com/DualSubs/Universal/releases/latest/download/Translate.response.bundle.js
    env:
      _compat.$argument: Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_response:
    name: 🍿️ DualSubs.Spotify.Translate.Lyrics.response.proto
    match: ^https?:\/\/(.+-spclient|spclient\.wg).spotify\.com(:443)?\/color-lyrics\/v2\/track\/\w+\?(.*)subtype=Translate
    script_url: https://github.com/DualSubs/Universal/releases/latest/download/Translate.response.bundle.js
    env:
      _compat.$argument: Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
    binary_body: true
- http_response:
    name: 🍿️ DualSubs.Spotify.External.Lyrics.response.json
    match: ^https?:\/\/(.+-spclient|spclient\.wg).spotify\.com(:443)?\/color-lyrics\/v2\/track\/(.+)\?(.*)format=json(.*)subtype=External
    script_url: https://github.com/DualSubs/Universal/releases/latest/download/External.Lyrics.response.bundle.js
    env:
      _compat.$argument: Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_response:
    name: 🍿️ DualSubs.Spotify.External.Lyrics.response.proto
    match: ^https?:\/\/(.+-spclient|spclient\.wg).spotify\.com(:443)?\/color-lyrics\/v2\/track\/\w+\?(.*)subtype=External
    script_url: https://github.com/DualSubs/Universal/releases/latest/download/External.Lyrics.response.bundle.js
    env:
      _compat.$argument: Types="{{{Types}}}"&Languages[0]="{{{Languages[0]}}}"&Languages[1]="{{{Languages[1]}}}"&Vendor="{{{Vendor}}}"&LrcVendor="{{{LrcVendor}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
    binary_body: true
mitm:
  hostnames:
    includes:
    - dualsubs.github.io
    - api.spotify.com
    - spclient.wg.spotify.com
    - '*-spclient.spotify.com'
