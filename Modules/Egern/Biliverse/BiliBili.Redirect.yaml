  Host.MCDN: [主机名] 重定向 MCDN 主机名 (中国大陆)
      └ proxy-tf-all-ws.bilivideo.com: proxy-tf-all-ws.bilivideo.com
  请选择 MCDN 要重定向的主机名。

  Storage: [储存] 配置类型
      ├ Argument: 优先使用来自 $argument 的配置，$argument 不包含的设置项由 PersistentStore (BoxJs) 提供
      ├ PersistentStore: 只使用 PersistentStore (BoxJs) 提供的配置
      └ database: 只使用由作者的 database.mjs 文件提供的默认配置，其他任何自定义配置不再起作用
  选择要使用的配置类型。未设置此选项或不通过此选项的旧版本的配置顺序依旧是 PersistentStore (BoxJs) > $argument > database.

  LogLevel: [调试] 日志等级
      ├ OFF: 关闭
      ├ ERROR: ❌ 错误
      ├ WARN: ⚠️ 警告
      ├ INFO: ℹ️ 信息
      ├ DEBUG: 🅱️ 调试
      └ ALL: 全部
  选择脚本日志的输出等级，低于所选等级的日志将全部输出。
open_url: http://boxjs.com/#/app/BiliBili.Redirect
author: VirgilClyne[https://github.com/VirgilClyne]
homepage: https://biliverse.github.io/guide/redirect
icon: https://github.com/Biliverse/Redirect/raw/main/src/assets/icon_rounded.png
dns: {}
url_rewrites:
- match: ^http:\/\/upos-sz-mirror[a-z0-9-]*ov\.bilivideo\.com(?::80)?\/upgcxcode\/
  location: http://{{{Host.OverseaVideo}}}/upgcxcode/
- match: ^http:\/\/cn-hk-eq-[a-z0-9-]+\.bilivideo\.com(?::80)?\/upgcxcode\/
  location: http://{{{Host.OverseaVideo}}}/upgcxcode/
- match: ^http:\/\/upos-hz-mirrorakam\.akamaized\.net(?::80)?\/upgcxcode\/
  location: http://{{{Host.OverseaVideo}}}/upgcxcode/
- match: ^http:\/\/upos-sz-mirrorakam\.akamaized\.net(?::80)?\/upgcxcode\/
  location: http://{{{Host.OverseaVideo}}}/upgcxcode/
- match: ^http:\/\/upos-sz-mirror[a-z0-9-]*bstar1\.bilivideo\.com(?::80)?\/upgcxcode\/
  location: http://{{{Host.BStar}}}/upgcxcode/
- match: ^http:\/\/upos-bstar1-mirrorakam\.akamaized\.net(?::80)?\/upgcxcode\/
  location: http://{{{Host.BStar}}}/upgcxcode/
- match: ^https:\/\/upos-sz-mirror[a-z0-9-]*ov\.bilivideo\.com(?::(?:443|4483))?\/upgcxcode\/
  location: https://{{{Host.OverseaVideo}}}/upgcxcode/
- match: ^https:\/\/cn-hk-eq-[a-z0-9-]+\.bilivideo\.com(?::(?:443|4483))?\/upgcxcode\/
  location: https://{{{Host.OverseaVideo}}}/upgcxcode/
- match: ^https:\/\/upos-hz-mirrorakam\.akamaized\.net(?::(?:443|4483))?\/upgcxcode\/
  location: https://{{{Host.OverseaVideo}}}/upgcxcode/
- match: ^https:\/\/upos-sz-mirrorakam\.akamaized\.net(?::(?:443|4483))?\/upgcxcode\/
  location: https://{{{Host.OverseaVideo}}}/upgcxcode/
- match: ^https:\/\/upos-sz-mirror[a-z0-9-]*bstar1\.bilivideo\.com(?::(?:443|4483))?\/upgcxcode\/
  location: https://{{{Host.BStar}}}/upgcxcode/
- match: ^https:\/\/upos-bstar1-mirrorakam\.akamaized\.net(?::(?:443|4483))?\/upgcxcode\/
  location: https://{{{Host.BStar}}}/upgcxcode/
map_locals:
- match: ^https:\/\/(?:biliverse\.github\.io|app\.bilibili\.com)\/api\/Redirect(?:\?.*)?$
  to: https://github.com/Biliverse/Redirect/releases/download/v0.2.25/BiliBili.Redirect.boxjs.json
  status_code: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Cache-Control: no-store
    X-PreferencePanes-Version: 0.2.25
scriptings:
- http_request:
    name: 📺 BiliBili.Redirect.CDN.upgcxcode.m4s
    match: ^https?:\/\/.+\.bilivideo\.com(?::(?:80|443|4483))?\/upgcxcode\/
    script_url: https://github.com/Biliverse/Redirect/releases/download/v0.2.25/request.bundle.js
    env:
      _compat.$argument: Host.OverseaVideo="{{{Host.OverseaVideo}}}"&Host.BStar="{{{Host.BStar}}}"&Host.PCDN="{{{Host.PCDN}}}"&Host.MCDN="{{{Host.MCDN}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
- http_request:
    name: 📺 BiliBili.Redirect.MCDN.v1.resource.m4s
    match: ^https?:\/\/[adbcefxy0-9]+\.mcdn\.bilivideo\.cn(?::(?:8000|8082))?\/v1\/resource\/
    script_url: https://github.com/Biliverse/Redirect/releases/download/v0.2.25/request.bundle.js
    env:
      _compat.$argument: Host.OverseaVideo="{{{Host.OverseaVideo}}}"&Host.BStar="{{{Host.BStar}}}"&Host.PCDN="{{{Host.PCDN}}}"&Host.MCDN="{{{Host.MCDN}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
