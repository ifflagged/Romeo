name: '🪐 Biliverse: ⚙️ Enhanced'
description: |-
  哔哩哔哩：增强模式
  中国站功能增强及UI自定义
compat_arguments:
  Home.Switch: 'true'
  Home.Tab: 2036,2037,780,545,151
  Home.Tab_default: '2037'
  Home.Top_left: mine
  Home.Top: messages
  Home.Top_more: categories,search
  Bottom: home,dynamic,ogv,mall,mine
  Region.Switch: 'true'
  Mine.Switch: 'true'
  Mine.iPad.Switch: 'true'
  Storage: PersistentStore
  LogLevel: WARN
compat_arguments_desc: |
  Home.Switch: [首页] 启用自定义功能
  启用后可自定义首页顶栏、标签页和底部导航栏内容。标签页由分区页的快捷访问决定。

  Home.Tab: [首页] 标签页
      ├ 2036: 直播
      ├ 2037: 推荐
      ├ 780: 热门
      ├ 545: 番剧
      ├ 774: 动画（港澳台）
      ├ 151: 影视
      ├ 801: 韩综（港澳台）
      └ 2280: 校园
  这里只列出常用选项；分区页提供接近60个快捷访问选项，无法在模块参数中完整列出。请前往 BiliBili App 分区页，使用原生“快捷访问”功能自定义首页标签页。

  Home.Tab_default: [首页] 默认标签页
      ├ 2036: 直播
      ├ 2037: 推荐
      ├ 780: 热门
      ├ 545: 番剧
      ├ 774: 动画（港澳台）
      ├ 151: 影视
      ├ 801: 韩综（港澳台）
      └ 2280: 校园
  请选择启动APP时默认展示的标签页，需先将该标签页加入分区页的快捷访问。

  Home.Top_left: [首页] 顶栏（左侧）按钮（用户头像）
      ├ mine: 用户中心-我的
      └ videoshortcut: 短视频
  请选择顶栏（左侧）按钮（用户头像）的作用（在biliBili粉色版中无法修改）。

  Home.Top: [首页] 顶栏（右侧）按钮
      ├ game_center: 游戏中心
      ├ mall: 会员购
      └ messages: 消息
  请选择启用的顶栏（右侧）按钮。

  Home.Top_more: [首页] 标签栏右侧按钮
      ├ categories: 更多分区
      └ search: 搜索
  请选择启用的首页标签栏右侧按钮。

  Bottom: [底部] 导航栏按钮
      ├ home: 首页
      ├ dynamic: 动态
      ├ publish: 发布
      ├ ogv: 节目（港澳台）
      ├ mall: 会员购
      ├ messages: 消息
      └ mine: 我的
  请选择启用的底部导航栏按钮，最多6个。

  Region.Switch: [分区] 启用此标签页自定义功能
  启用后可自定义分区标签页的内容。

  Mine.Switch: [我的] 启用此标签页自定义功能
  启用后可自定义我的标签页的服务内容。

  Mine.iPad.Switch: [我的 iPad版] 启用此标签页自定义功能
  启用后可自定义iPad版我的标签页的服务内容。

  Storage: [储存] 配置类型
      ├ Argument: 优先使用 $argument，其次使用 PersistentStore (BoxJs)，最后使用 database.mjs 的默认配置
      ├ PersistentStore: 优先使用 PersistentStore (BoxJs)，其次使用 $argument，最后使用 database.mjs 的默认配置
      └ database: 只使用由作者的 database.mjs 文件提供的默认配置，其他任何自定义配置不再起作用
  默认使用 PersistentStore，配置优先级为 database -> $argument -> PersistentStore (BoxJs)；选择 Argument 时为 database -> PersistentStore (BoxJs) -> $argument。

  LogLevel: [调试] 日志等级
      ├ OFF: 关闭
      ├ ERROR: ❌ 错误
      ├ WARN: ⚠️ 警告
      ├ INFO: ℹ️ 信息
      ├ DEBUG: 🅱️ 调试
      └ ALL: 全部
  选择脚本日志的输出等级，低于所选等级的日志将全部输出。
open_url: http://boxjs.com/#/app/Biliverse.Enhanced
author: VirgilClyne[https://github.com/VirgilClyne]
homepage: https://biliverse.github.io/guide/enhanced
icon: https://github.com/Biliverse/Enhanced/raw/main/src/assets/icon_rounded.png
dns: {}
map_locals:
- match: ^https:\/\/app\.bilibili\.com\/settings\/(?:\?[^#]*)?$
  to: https://biliverse.github.io/settings/
  status_code: 200
  headers:
    Content-Type: text/html
    Cache-Control: no-store
- match: ^https:\/\/app\.bilibili\.com\/settings\/theme\.css(?:\?[^#]*)?$
  to: https://biliverse.github.io/settings/theme.css
  status_code: 200
  headers:
    Content-Type: text/css
    Cache-Control: no-store
- match: ^https:\/\/app\.bilibili\.com\/settings\/index\.mjs(?:\?[^#]*)?$
  to: https://biliverse.github.io/settings/index.mjs
  status_code: 200
  headers:
    Content-Type: text/javascript
    Cache-Control: no-store
- match: ^https:\/\/app\.bilibili\.com\/settings\/assets\/Biliverse_subject\.png(?:\?[^#]*)?$
  to: https://biliverse.github.io/settings/assets/Biliverse_subject.png
  status_code: 200
  headers:
    Content-Type: image/png
    Cache-Control: no-store
- match: ^https:\/\/app\.bilibili\.com\/settings\/assets\/Enhanced_subject\.png(?:\?[^#]*)?$
  to: https://biliverse.github.io/settings/assets/Enhanced_subject.png
  status_code: 200
  headers:
    Content-Type: image/png
    Cache-Control: no-store
- match: ^https:\/\/app\.bilibili\.com\/settings\/assets\/Global_subject\.png(?:\?[^#]*)?$
  to: https://biliverse.github.io/settings/assets/Global_subject.png
  status_code: 200
  headers:
    Content-Type: image/png
    Cache-Control: no-store
- match: ^https:\/\/app\.bilibili\.com\/settings\/assets\/Redirect_subject\.png(?:\?[^#]*)?$
  to: https://biliverse.github.io/settings/assets/Redirect_subject.png
  status_code: 200
  headers:
    Content-Type: image/png
    Cache-Control: no-store
- match: ^https:\/\/app\.bilibili\.com\/settings\/assets\/ADBlock_subject\.png(?:\?[^#]*)?$
  to: https://biliverse.github.io/settings/assets/ADBlock_subject.png
  status_code: 200
  headers:
    Content-Type: image/png
    Cache-Control: no-store
- match: ^https:\/\/(?:biliverse\.github\.io|app\.bilibili\.com)\/settings\/[a-zA-Z0-9_-]+\/?(?:\?[^#]*)?$
  to: https://github.com/NSNanoCat/PreferencePanes/releases/latest/download/index.html
  status_code: 200
  headers:
    Content-Type: text/html
    Cache-Control: no-store
- match: ^https:\/\/(?:biliverse\.github\.io|app\.bilibili\.com)\/settings\/assets\/index\.mjs(?:\?[^#]*)?$
  to: https://github.com/NSNanoCat/PreferencePanes/releases/latest/download/index.mjs
  status_code: 200
  headers:
    Content-Type: text/javascript
    Cache-Control: no-store
- match: ^https:\/\/(?:biliverse\.github\.io|app\.bilibili\.com)\/settings\/assets\/navigation\.mjs(?:\?[^#]*)?$
  to: https://github.com/NSNanoCat/PreferencePanes/releases/latest/download/navigation.mjs
  status_code: 200
  headers:
    Content-Type: text/javascript
    Cache-Control: no-store
- match: ^https:\/\/(?:biliverse\.github\.io|app\.bilibili\.com)\/api\/Enhanced(?:\?.*)?$
  to: https://github.com/Biliverse/Enhanced/releases/download/v0.6.0/Biliverse.Enhanced.PreferencePanes.json
  status_code: 200
  headers:
    Content-Type: application/json; charset=utf-8
    Cache-Control: no-store
    X-PreferencePanes-Version: 0.6.0
scriptings:
- http_request:
    name: PreferencePanes.API
    match: ^https:\/\/(?:biliverse\.github\.io|app\.bilibili\.com)\/api\/(?:get|set|delete)(?:\?.*)?$
    script_url: https://github.com/NSNanoCat/PreferencePanes/releases/latest/download/api.js
    max_size: 65536
    body_required: true
- http_response:
    name: 📺 Biliverse.Enhanced.x.resource.show.tab.v2
    match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/resource\/show\/tab\/v2\?
    script_url: https://github.com/Biliverse/Enhanced/releases/download/v0.6.0/response.bundle.js
    env:
      _compat.$argument: Home.Switch="{{{Home.Switch}}}"&Home.Tab="{{{Home.Tab}}}"&Home.Tab_default="{{{Home.Tab_default}}}"&Home.Top_left="{{{Home.Top_left}}}"&Home.Top="{{{Home.Top}}}"&Home.Top_more="{{{Home.Top_more}}}"&Bottom="{{{Bottom}}}"&Region.Switch="{{{Region.Switch}}}"&Mine.Switch="{{{Mine.Switch}}}"&Mine.iPad.Switch="{{{Mine.iPad.Switch}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_request:
    name: 📺 Biliverse.Enhanced.show.v1.Mixture.RegionShortcut.request.grpc
    match: ^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.show\.v1\.Mixture\/RegionShortcut$
    script_url: https://github.com/Biliverse/Enhanced/releases/download/v0.6.0/request.bundle.js
    env:
      _compat.$argument: Home.Switch="{{{Home.Switch}}}"&Home.Tab="{{{Home.Tab}}}"&Home.Tab_default="{{{Home.Tab_default}}}"&Home.Top_left="{{{Home.Top_left}}}"&Home.Top="{{{Home.Top}}}"&Home.Top_more="{{{Home.Top_more}}}"&Bottom="{{{Bottom}}}"&Region.Switch="{{{Region.Switch}}}"&Mine.Switch="{{{Mine.Switch}}}"&Mine.iPad.Switch="{{{Mine.iPad.Switch}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
    binary_body: true
- http_response:
    name: 📺 Biliverse.Enhanced.show.v1.Mixture.RegionList.response.grpc
    match: ^https?:\/\/(grpc|app)\.bili(bili\.com|api\.net)\/bilibili\.app\.show\.v1\.Mixture\/RegionList$
    script_url: https://github.com/Biliverse/Enhanced/releases/download/v0.6.0/response.bundle.js
    env:
      _compat.$argument: Home.Switch="{{{Home.Switch}}}"&Home.Tab="{{{Home.Tab}}}"&Home.Tab_default="{{{Home.Tab_default}}}"&Home.Top_left="{{{Home.Top_left}}}"&Home.Top="{{{Home.Top}}}"&Home.Top_more="{{{Home.Top_more}}}"&Bottom="{{{Bottom}}}"&Region.Switch="{{{Region.Switch}}}"&Mine.Switch="{{{Mine.Switch}}}"&Mine.iPad.Switch="{{{Mine.iPad.Switch}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    max_size: 262144
    body_required: true
    binary_body: true
- http_response:
    name: 📺 Biliverse.Enhanced.x.v2.account.mine
    match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/account\/mine(\/ipad)?\?
    script_url: https://github.com/Biliverse/Enhanced/releases/download/v0.6.0/response.bundle.js
    env:
      _compat.$argument: Home.Switch="{{{Home.Switch}}}"&Home.Tab="{{{Home.Tab}}}"&Home.Tab_default="{{{Home.Tab_default}}}"&Home.Top_left="{{{Home.Top_left}}}"&Home.Top="{{{Home.Top}}}"&Home.Top_more="{{{Home.Top_more}}}"&Bottom="{{{Bottom}}}"&Region.Switch="{{{Region.Switch}}}"&Mine.Switch="{{{Mine.Switch}}}"&Mine.iPad.Switch="{{{Mine.iPad.Switch}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_response:
    name: 📺 Biliverse.Enhanced.x.v2.region.index
    match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/region\/index\?
    script_url: https://github.com/Biliverse/Enhanced/releases/download/v0.6.0/response.bundle.js
    env:
      _compat.$argument: Home.Switch="{{{Home.Switch}}}"&Home.Tab="{{{Home.Tab}}}"&Home.Tab_default="{{{Home.Tab_default}}}"&Home.Top_left="{{{Home.Top_left}}}"&Home.Top="{{{Home.Top}}}"&Home.Top_more="{{{Home.Top_more}}}"&Bottom="{{{Bottom}}}"&Region.Switch="{{{Region.Switch}}}"&Mine.Switch="{{{Mine.Switch}}}"&Mine.iPad.Switch="{{{Mine.iPad.Switch}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
- http_response:
    name: 📺 Biliverse.Enhanced.x.v2.channel.region.list
    match: ^https?:\/\/app\.bili(bili\.com|api\.net)\/x\/v2\/channel\/region\/list\?
    script_url: https://github.com/Biliverse/Enhanced/releases/download/v0.6.0/response.bundle.js
    env:
      _compat.$argument: Home.Switch="{{{Home.Switch}}}"&Home.Tab="{{{Home.Tab}}}"&Home.Tab_default="{{{Home.Tab_default}}}"&Home.Top_left="{{{Home.Top_left}}}"&Home.Top="{{{Home.Top}}}"&Home.Top_more="{{{Home.Top_more}}}"&Bottom="{{{Bottom}}}"&Region.Switch="{{{Region.Switch}}}"&Mine.Switch="{{{Mine.Switch}}}"&Mine.iPad.Switch="{{{Mine.iPad.Switch}}}"&Storage="{{{Storage}}}"&LogLevel="{{{LogLevel}}}"
    body_required: true
mitm:
  hostnames:
    includes:
    - biliverse.github.io
    - app.bilibili.com
    - app.biliapi.net
    - grpc.biliapi.net
