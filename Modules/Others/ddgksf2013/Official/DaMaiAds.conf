hostname = acs.m.taobao.com

^https?:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.wireless\.home\.welcome url reject-200
  
^https?:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.mec\.popup\.get url reject-200
  
# > amdc
^http:\/\/[a-zA-Z0-9_-]+(\.[a-zA-Z0-9_-]+){1,4}(:\d+)?\/amdc\/mobileDispatch url script-response-body https://raw.githubusercontent.com/ddgksf2013/Scripts/refs/heads/master/amdc.js

# > 首页主接口：去搜索热词、AI入口、AR入口、首页大Banner、天天抽奖、信息流插片
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.mec\.aristotle\.get\/[\d.]+\/ url jsonjq-response-body '.data.data.top.keywords=[] | .data.data.top.aiUrl="" | .data.data.top.aiLottieUrl="" | .data.data.top.aiLottieAmbientUrl="" | .data.data.top.arScan={} | .data.nodes=((.data.nodes // []) | map(select(((.nodes[0].data.componentId // "") != "dm_home_supper_banner"))) | map(if ((.nodes[0].data.componentId // "") == "dm_pioneer_function_area_with_city_rank") then .nodes[0].nodes=((.nodes[0].nodes // []) | map(select(.data.title != "天天抽奖"))) else . end) | map(if ((.nodes[0].data.componentId // "") == "dm_pioneer_home_feed") then .nodes[0].nodes=((.nodes[0].nodes // []) | map(if (.nodes? != null) then .nodes=((.nodes // []) | map(select(.data.cardType != "15" and .data.cardType != "21"))) else . end)) else . end))'

# > 首页全局配置：去搜索推荐词、弹窗配置、头部动效
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.wireless\.home\.appglobalconfig\/[\d.]+\/ url jsonjq-response-body '.data.pop={} | .data.searchTip={} | .data.searchTips=[] | .data.headLottie={} | .data.headStyle={}'

# > 首页浮窗
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.wireless\.home\.float\/[\d.]+\/ url jsonjq-response-body '.data={}'

# > 预加载广告
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.film\.independentadvertiseapi\.querypreloadadvlist\/[\d.]+\/ url jsonjq-response-body '.data.adList=[]'

# > 想看 / 抽奖动画
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.film\.mtopmindapi\.loadwantshowlotteryanimationurl\/[\d.]+\/ url jsonjq-response-body '.data.returnValue={}'

# > 我的页：去Banner、VIP卡片、特惠专区、周边商城、观演团、电影包场、公益入口
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.wireless\.user\.my\.content\.get\/[\d.]+\/ url jsonjq-response-body '.data.banner=[] | .data.dynamicMenu.itemList=((.data.dynamicMenu.itemList // []) | map(select(.title != "周边商城" and .title != "观演团" and .title != "电影包场" and .title != "公益三小时" and .title != "大麦VIP卡" and .title != "特惠专区"))) | .data.performFilmVip={} | .data.showVip=false | .data.vipCardInfo={}'

# > 发布奖励提示
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.wireless\.discovery\.publish\.check\/[\d.]+\/ url jsonjq-response-body '.data.appPublishHint=""'

# > 搜索框推荐词
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.search\.tips\.get\/[\d.]+\/ url jsonjq-response-body '.data.result=[]'

# > 搜索页热榜
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.search\.pioneer\.page\.get\/[\d.]+\/ url jsonjq-response-body '.data.rankInfo.localSearchRankingList=[] | .data.rankInfo.searchFilmRankingList=[] | .data.rankInfo.searchRankingList=[] | .data.rankInfo.description="" | .data.rankInfo.name=""'

# > AI入口配置
^https:\/\/acs\.m\.taobao\.com\/gw\/mtop\.damai\.wireless\.ai\.pageconfig\/[\d.]+\/ url jsonjq-response-body '.data.enable="false" | .data.aiLottieUrl=""'

