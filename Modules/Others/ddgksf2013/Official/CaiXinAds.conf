// ==UserScript==
// @ScriptName        财新净化[墨鱼版]
// @Author            @ddgksf2013
// @Function          如果有需要的去除广告的APP，可自行在共享表格中添加需求
// @AddRequest        https://bit.ly/addRequestforAdBlock
// @WechatID          墨鱼手记
// @TgChannel         https://t.me/ddgksf2021
// @Contribute        https://t.me/ddgksf2013_bot
// @Feedback          📮 ddgksf2013@163.com 📮
// @UpdateTime        2026-08-20
// @Suitable          自行观看“# > ”注释内容
// @Attention         如需引用请注明出处，谢谢合作！
// @Version           V1.0.1
// @ScriptURL         https://ddgksf2013.top/rewrite/CaiXinAds.conf
// ==/UserScript==


hostname = gateway.caixin.com, msgapi.caixin.com, gg.caixin.com, dolphin.caixin.com, www.caixin.com


# > 广告配置 / AI入口 / 商城 / 热选
^https:\/\/gateway\.caixin\.com\/api\/app-api\/caixinapp\/appinfo url jsonjq-response-body '.data.adConfig.audio_ad=[] | .data.adConfig.article_ad=[] | .data.adConfig.channel_list_ad=[] | .data.memberCharge=null | .data.inviteFriend=null | .data.topLeftBtnList=[] | .data.userCenterSettingsConfigV2.memberCharge=[] | .data.userCenterSettingsConfigV2.topLeftBtnList=[] | .data.userCenterSettingsConfigV2.topRightBtnList=((.data.userCenterSettingsConfigV2.topRightBtnList // []) | map(select(.code!="hotSelection"))) | .data.channel.channel_show=((.data.channel.channel_show // []) | map(select(.id!="186" and .name!="AI荐读"))) | .data.channel.channel_hide=((.data.channel.channel_hide // []) | map(select(.id!="186" and .name!="AI荐读"))) | .data.channelList=((.data.channelList // []) | map(select(.id!=186 and .name!="AI荐读"))) | .data.homePageWatchingList=((.data.homePageWatchingList // []) | map(select(.title!="AI全景"))) | .data.aiConfig=null | .data.isShowAiPairedReading="0" | .data.isShowAiAbFeature="0"'

# > AI荐读频道
^https:\/\/gateway\.caixin\.com\/api\/app-api\/userChannelNew\/getUserChannel url jsonjq-response-body '.data=((.data // []) | map(select(.channelId!=186)))'

# > 广告数据
^https:\/\/gateway\.caixin\.com\/api\/app-api\/adInfoData\/getDateAdAll url jsonjq-response-body '.data=[]'

# > 启动页运营海报
^https:\/\/gateway\.caixin\.com\/api\/app-api\/poster\/getAll url jsonjq-response-body '.data=[]'

# > 气泡 / 运营提示
^https:\/\/gateway\.caixin\.com\/api\/app-api\/cxBubbleInfo\/getCxBubbleInfo(?:V3)? url jsonjq-response-body '.data=[]'

# > 公告 / AI荐读推广
^https:\/\/msgapi\.caixin\.com\/msg_api\/annmsg\/annlist\/ url jsonjq-response-body '.data=[]'

# > 搜索推荐词 / 热点新闻
^https:\/\/gateway\.caixin\.com\/api\/app-api\/search\/getkeyword url jsonjq-response-body '.data.keys=[] | .data.hot_news=[]'

# > 文章页猜你想问
^https:\/\/www\.caixin\.com\/ai\/question\/\d+\/\d+\.js url reject-200

# > 原生广告 / 开屏 / 信息流 / Banner
^https:\/\/gg\.caixin\.com\/s url reject-200

# > 文章页广告
^https:\/\/dolphin\.caixin\.com\/s url reject-200

# > 数据统计上报
^https:\/\/gateway\.caixin\.com\/api\/stat\/v\d\/client_data\/from_app url reject-200
