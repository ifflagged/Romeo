// ==UserScript==
// @ScriptName        Zaker净化[墨鱼版]
// @Author            @ddgksf2013
// @Function          如果有需要的去除广告的APP，可自行在共享表格中添加需求
// @AddRequest        https://bit.ly/addRequestforAdBlock
// @WechatID          墨鱼手记
// @TgChannel         https://t.me/ddgksf2021
// @Contribute        https://t.me/ddgksf2013_bot
// @Feedback          📮 ddgksf2013@163.com 📮
// @UpdateTime        2026-11-1
// @Suitable          自行观看“# > ”注释内容
// @Attention         如需引用请注明出处，谢谢合作！
// @Version           V1.0.3
// @ScriptURL         https://ddgksf2013.top/rewrite/ZakerAds.conf
// ==/UserScript==

hostname = iphone.myzaker.com, ggs.myzaker.com, search.myzaker.com


^https:\/\/iphone\.myzaker\.com\/zaker\/cover\.php url jsonjq-response-body '.data.cover_ads = {}'

^https:\/\/ggs\.myzaker\.com\/zk_block_ad\.php url jsonjq-response-body '.data |= (del(.tofu_partner_ad) | with_entries(if (.key as $k | ["ad_list","pic_ad_list","ad_position","pic_ad_position","ad_position_integration","pic_ad_position_integration"] | index($k)) != null then .value = [] else . end))'

^https:\/\/ggs\.myzaker\.com\/zk_recommend_ad\.php url jsonjq-response-body '.data.ad_list = [] | .data.ad_position_integration = [] | del(.data.partner_ad)'

^https?:\/\/search\.myzaker\.com\/api\/\?(?:[^&]*&)*c=keywords(&|$) url jsonjq-response-body 'if (.data.wordlist? | type) == "array" then .data.wordlist |= map(select(.pk != "hotwords" and .pk != "keywords")) else . end'
