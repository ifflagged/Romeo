// ==UserScript==
// @ScriptName        转转净化[墨鱼版]
// @Author            @ddgksf2013
// @Function          如果有需要的去除广告的APP，可自行在共享表格中添加需求
// @AddRequest        https://bit.ly/addRequestforAdBlock
// @WechatID          墨鱼手记
// @TgChannel         https://t.me/ddgksf2021
// @Contribute        https://t.me/ddgksf2013_bot
// @Feedback          📮 ddgksf2013@163.com 📮
// @UpdateTime        2026-08-24
// @Suitable          自行观看“# > ”注释内容
// @Attention         如需引用请注明出处，谢谢合作！
// @Version           V1.0.6
// @ScriptURL         https://ddgksf2013.top/rewrite/ZhuanZhuanAds.conf
// ==/UserScript==



hostname = app.zhuanzhuan.com, lego.zhuanzhuan.com, lego-tech.zhuanzhuan.com, sentry.zhuanzhuan.com, wkdcm1.tingyun.com, wkrt.tingyun.com

# > 开屏广告
^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzlogic\/getOpenScreen url jsonjq-response-body '.respData=null'

# > 弹窗 / 悬浮窗 / 气泡 / 顶部运营
^https:\/\/app\.zhuanzhuan\.com\/zzopen\/popwindow\/getallpopwin url jsonjq-response-body '.respData.popWindow=null | .respData.bottomFloat=null | .respData.bubbleGuide=null | .respData.topOperation=null | .respData.topOperationIsOther=false'

# > 首页 Banner / 悬浮挂件 / 运营卡片
^https:\/\/app\.zhuanzhuan\.com\/api\/zzlogic\/cbchomepage url jsonjq-response-body '.respData.topActBanner=null | .respData.leftPendant={} | .respData.operationCardArea=null | .respData.horizontalCard=null | .respData.newUserArea=null | .respData.redInfoBanner=null'

# > 回收首页 Banner / 登录礼包 / 运营位
^https:\/\/app\.zhuanzhuan\.com\/zzopen\/zzbmlogic\/queryFrontPageWindowInfo url jsonjq-response-body '.respData.bannerInfo.data=[] | .respData.popupInfo={} | .respData.operatingInfo=[] | .respData.rightBanner=null | .respData.topAtmosphereV2.carouselList=[]'

# > 首页信息流推广
^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzinfoshow\/getfeedflowinfo url jsonjq-response-body '.respData.infoData=((.respData.infoData // []) | map(select(.type!=29)))'

# > 新人专区
^https:\/\/app\.zhuanzhuan\.com\/api\/ptlogic\/getnewcomerzoneentry url jsonjq-response-body '.respData=null'

# > 搜索推荐 / 热搜
^https:\/\/app\.zhuanzhuan\.com\/zzopen\/zzbmlogic\/getSearchHomePageConfig url jsonjq-response-body '.respData.searchWords=[] | .respData.hotBrands=[] | .respData.hotSearch=[] | .respData.hotOrder=[]'

# > 搜索推荐词
^https:\/\/app\.zhuanzhuan\.com\/zz\/transfer\/getsearchword url jsonjq-response-body '.respData.recommendword.data=[]'

# > 搜索框推荐
^https:\/\/app\.zhuanzhuan\.com\/zz\/transfer\/getsearchconfigdata url jsonjq-response-body '.respData.goods=[] | .respData.officialCheckMindWordConfig={}'

# > 搜索页榜单 / 活动推荐
^https:\/\/app\.zhuanzhuan\.com\/api\/zzlogic\/getShowCaseWords url jsonjq-response-body '.respData.showCaseData=[]'

# > 浏览赚钱 / 问卷推广
^https:\/\/app\.zhuanzhuan\.com\/zzx\/transfer\/getConfigInfo url jsonjq-response-body '.respData.zzReport={} | .respData.questionnairePop=[]'

# > 我的页推广
^https:\/\/app\.zhuanzhuan\.com\/zzopen\/ptuserlogic\/getmymien url jsonjq-response-body '.respData.bmNewInfo=null | .respData.activityField=null | .respData.miniActivityField=null | .respData.memberCenter=null | .respData.displayChoiceGoodsFeed=0 | .respData.walletArea.cardItems=((.respData.walletArea.cardItems // []) | map(select(.tokenId=="balance"))) | .respData.toolbarArea=((.respData.toolbarArea // []) | map(select(.tokenId!="3cInvest" and .tokenId!="quzuji" and .tokenId!="financial" and .tokenId!="fenqishagncheng" and .tokenId!="dianyuanzhaomu" and .tokenId!="offlStore" and .tokenId!="equity")))'

# > 我的页运营卡片
^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzusercenter\/myprofilevariouscardsv2 url jsonjq-response-body '.respData.cardList=[]'

# > 我的页商品推荐
^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzinfoshow\/getchoicegoodsinfos url jsonjq-response-body '.respData.infoData=[]'

# > 红点提示
^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/corecyclelogic\/getredpointconfig url jsonjq-response-body '.respData.showFlag=0 | .respData.picture=""'
^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzlogic\/tabredpoint url jsonjq-response-body '.respData={}'

# > 行为埋点
^https:\/\/app\.zhuanzhuan\.com\/zz\/v\d\/zzlogic\/(?:reportdautracking|reportVariousData|reportPushChannelStatus|reporttabclick) url reject-dict
^https:\/\/lego\.zhuanzhuan\.com\/(?:v1\/coke|page\/mark) url reject-dict
^https:\/\/lego-tech\.zhuanzhuan\.com\/(?:v1\/coke-tech|page\/mark-p-tech) url reject-dict

# > Sentry / 听云监控
^https:\/\/sentry\.zhuanzhuan\.com\/api\/\d+\/envelope\/ url reject-dict
^https:\/\/wkdcm1\.tingyun\.com\/(?:initMobileApp|getTaskDefs|reportSpanData) url reject-dict
^https:\/\/wkrt\.tingyun\.com\/getMobileRedirectHost url reject-dict
